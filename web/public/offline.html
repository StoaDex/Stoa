<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#EEF2F6">
<title>Offline · Stoa</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: linear-gradient(180deg, #E6ECF3, #EEF2F6 60%); color: #1B2430;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 340px; margin: 24px; padding: 32px 28px; text-align: center; background: rgba(255,255,255,.85);

  img { width: 64px; height: 64px; }
  h1 { font: 500 26px/1.2 Georgia, "Times New Roman", serif; margin: 14px 0 8px; }
  p { margin: 0 0 22px; color: #5A6675; font-size: 15px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 14px; background: #2F6FD8; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="">
  <h1>No connection</h1>
  <p>Stoa needs the network for live prices and swaps. Check your signal and try again.</p>
  <a href="">Try again</a>
</main>
